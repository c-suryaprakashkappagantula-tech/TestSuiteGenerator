[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# TSG's modules/ contains test_engine.py, test_analyst.py and test_data_injector.py, which
# are production modules rather than tests. testpaths keeps collection out of there.
markers =
    cache: needs a populated tsg_cache.db (all suite-level tests do)
    slow: builds several suites; excluded with -m "not slow"
minversion = 7.0
